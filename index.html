<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat UI — Black & Blue</title>
   <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#chat" aria-label="Chat home">NEXUS</a>
    <nav class="view-switcher" aria-label="Workspace views">
      <button class="view-tab active" type="button" data-view="chat" aria-controls="chatView" aria-pressed="true">Chats</button>
      <button class="view-tab" type="button" data-view="tasks" aria-controls="tasksView" aria-pressed="false">Tasks</button>
    </nav>
    <div class="header-status">Workspace <span></span></div>
  </header>

  <main class="view-container">
  <div id="chatView" class="app" data-view-panel="chat">
    <aside class="sidebar">
      <div class="sidebar-top">
        <h1 class="app-title">Chats</h1>
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="Search users..." />
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        </div>
      </div>

      <ul id="usersList" class="users-list">
        <!-- JS inserts user rows here -->
      </ul>
    </aside>

    <main class="chat-area">
      <header class="chat-header">
        <div class="contact-meta">
          <div class="contact-avatar" id="chatAvatar"></div>
          <div class="contact-info">
            <div id="contactName" class="contact-name">Select a chat</div>
            <div id="contactPresence" class="contact-presence">Offline</div>
          </div>
        </div>
        <div class="chat-actions">
          <button class="action-btn" title="Call" id="callBtn">
            <!-- call SVG -->
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24 11.72 11.72 0 0 0 3.68.59 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h2.5a1 1 0 0 1 1 1 11.72 11.72 0 0 0 .59 3.68 1 1 0 0 1-.24 1.01z"/></svg>
          </button>
          <button class="action-btn" title="Menu" id="menuBtn">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 8a2 2 0 1 0 .001-3.999A2 2 0 0 0 12 8zm0 3a2 2 0 1 0 .001 3.999A2 2 0 0 0 12 11zm0 6a2 2 0 1 0 .001 3.999A2 2 0 0 0 12 17z"/></svg>
          </button>
        </div>
      </header>

      <section id="messages" class="messages">
        <!-- chat messages inserted here -->
      </section>

      <footer class="message-input-area">
        <div class="input-wrap">
          <input id="messageInput" type="text" placeholder="Type a message..." />
          <div class="input-icons">
            <label for="fileInput" class="icon-btn" title="Attach file">
              <input id="fileInput" type="file" hidden />
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16.5 6.5L9 14a4 4 0 1 1-5.66-5.66L9 2.69a6 6 0 1 1 8.48 8.48L11.5 17.17"/></svg>
            </label>

            <button id="emojiBtn" class="icon-btn" title="Emoji">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20zm-4-8a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm8 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-8.07 3.24a6 6 0 0 0 8.14 0 1 1 0 0 0-1.28-1.54 4 4 0 0 1-5.58 0 1 1 0 0 0-1.28 1.54z"/></svg>
            </button>

            <button id="micBtn" class="icon-btn" title="Record">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 14 0h-2zM11 19h2v3h-2z"/></svg>
            </button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <section id="tasksView" class="tasks-view" data-view-panel="tasks" hidden>
    <div class="tasks-heading">
      <div>
        <p class="eyebrow">Personal workspace</p>
        <h1>Task notepad</h1>
        <p class="tasks-subtitle">Keep the loose ends close to the conversation.</p>
      </div>
      <div class="task-count" id="taskCount">0 tasks</div>
    </div>

    <form class="task-composer" id="taskForm">
      <div class="composer-label">New note</div>
      <input type="text" id="taskTitle" placeholder="Task title" autocomplete="off" />
      <textarea id="taskDescription" placeholder="Write your note or task here..."></textarea>
      <button class="add-task-btn" type="submit"><span>+</span> Add task</button>
    </form>

    <div class="task-toolbar">
      <label class="task-search-wrap">
        <span class="sr-only">Search tasks</span>
        <input class="task-search" type="search" id="taskSearch" placeholder="Search tasks..." />
      </label>
      <button class="filter-btn active" type="button" data-filter="all">All</button>
      <button class="filter-btn" type="button" data-filter="open">Open</button>
      <button class="filter-btn" type="button" data-filter="completed">Done</button>
    </div>

    <div id="tasks" class="tasks-list"></div>
  </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
